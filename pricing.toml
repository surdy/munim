# Standard rate. Sonnet 5 also has introductory pricing of $2/$10 per MTok through
# 2026-08-31 — munim has no date-aware rates, so this bills at the standard rate and
# slightly over-reports Sonnet 5 until the intro period ends.
[[claude]]
match = "sonnet-5"
input = 3.0
output = 15.0
cache_write = 3.75
cache_read = 0.30

[[claude]]
match = "sonnet"
input = 3.0
output = 15.0
cache_write = 3.75
cache_read = 0.30

[[claude]]
match = "haiku-4.5"
input = 1.0
output = 5.0
cache_write = 1.25
cache_read = 0.10

[[claude]]
match = "haiku"
input = 0.25
output = 1.25
cache_write = 0.30
cache_read = 0.03

# Catch-all for unknown Claude models (Sonnet rate).
[claude_default]
input = 3.0
output = 15.0
cache_write = 3.75
cache_read = 0.30

